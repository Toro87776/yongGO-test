<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yong GO 養狗 - 登入 / 註冊</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 圖標庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts 引入軟圓字體提高親和力 -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

</head>
<body class="antialiased text-gray-800">
    <div class="mobile-container">
        <!-- 頂部裝飾圓弧與內容 -->
        <div class="w-full flex flex-col items-center pt-10 pb-4 px-6 relative">
            
            <!-- 手機頂部狀態欄模擬條 -->
            <div class="w-24 h-1 bg-gray-300 rounded-full mb-6 opacity-60"></div>

            <!-- LOGO 區域 (精確重現圖檔墨綠色線條標誌) -->
            <div class="flex flex-col items-center justify-center space-y-3 my-2 w-full">
                
                <!-- 墨綠色質感 Logo 與文字組合 -->
                <div class="flex flex-col items-center justify-center">
                    <!-- SVG 線條狗頭標誌 -->
                    <div class="w-28 h-20 flex items-center justify-center mb-1">
                        <img src="./image/logo.png" alt="YongGO養狗Logo" class="w-full h-full object-contain">
                    </div>
                </div>
            </div>

            <!-- 頁籤切換 (登入 / 註冊) -->
            <div class="w-full max-w-xs mt-6 flex justify-border border-b border-gray-200 text-center font-bold">
                <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2.5 text-base tab-active transition-all duration-200 focus:outline-none">
                    帳號登入
                </button>
                <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-2.5 text-base text-gray-400 hover:text-gray-600 transition-all duration-200 focus:outline-none">
                    新用戶註冊
                </button>
            </div>
        </div>
        <!-- 主要表單內容區塊 -->
        <div class="px-8 pb-8 flex-1 flex flex-col justify-between">
            <!-- 表單元件 -->
            <form id="authForm" onsubmit="handleFormSubmit(event)" class="space-y-4 mt-2">
                
                <!-- 帳號輸入框 -->
                <div class="space-y-1">
                    <label class="block text-sm font-bold text-[#2F533C] ml-1" for="username">
                        帳號
                    </label>
                    <div class="custom-input flex items-center border border-[#d2dcc8] rounded-2xl px-4 py-3.5">
                        <i class="fa-regular fa-user text-gray-400 mr-3 text-lg"></i>
                        <input 
                            type="text" 
                            id="username" 
                            name="username"
                            placeholder="請輸入帳號" 
                            required
                            class="w-full bg-transparent focus:outline-none text-gray-800 placeholder-gray-400 text-base"
                        >
                    </div>
                </div>

                <!-- 密碼輸入框 -->
                <div class="space-y-1">
                    <label class="block text-sm font-bold text-[#2F533C] ml-1" for="password">
                        密碼
                    </label>
                    <div class="custom-input flex items-center border border-[#d2dcc8] rounded-2xl px-4 py-3.5 relative">
                        <i class="fa-solid fa-lock text-gray-400 mr-3 text-lg"></i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            placeholder="請輸入密碼" 
                            required
                            class="w-full bg-transparent focus:outline-none text-gray-800 placeholder-gray-400 text-base pr-8"
                        >
                        <!-- 密碼顯示/隱藏 切換按鈕 -->
                        <button 
                            type="button" 
                            onclick="togglePasswordVisibility()" 
                            class="absolute right-4 text-gray-400 hover:text-gray-600 focus:outline-none"
                            aria-label="切換密碼顯示"
                        >
                            <i id="password-toggle-icon" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- 忘記密碼鏈結 -->
                <div id="forgot-pwd-link" class="flex justify-end pt-1">
                    <a href="#" onclick="showMessage('提示', '請聯繫客服重設密碼')" class="text-xs font-bold text-[#2F533C] opacity-80 hover:opacity-100 hover:underline">
                        忘記密碼？
                    </a>
                </div>

                <!-- 主要提交按鈕 -->
                <div class="pt-2">
                    <button 
                        type="submit" 
                        id="submit-btn"
                        class="w-full py-3.5 px-4 bg-[#2F533C] hover:bg-[#254230] active:bg-[#1c3324] text-white font-extrabold text-lg rounded-2xl btn-shadow transition-all duration-200 transform active:scale-95 flex items-center justify-center gap-2"
                    >
                        <span>註冊 / 登入</span>
                        <i class="fa-solid fa-arrow-right text-sm"></i>
                    </button>
                </div>
            </form>

            <!-- 第三方登入 / 分隔線區塊 -->
            <div class="mt-6 space-y-4">
                
                <!-- 分隔線與文字 -->
                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="flex-shrink mx-4 text-xs text-gray-400 font-bold">或使用以下方式</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>

                <!-- Google 登入按鈕 -->
                <button 
                    type="button" 
                    onclick="handleGoogleLogin()" 
                    class="w-full py-3.5 px-4 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 font-bold text-base rounded-2xl btn-google-shadow transition-all duration-200 flex items-center justify-center gap-3 active:scale-95"
                >
                    <!-- Google 彩色標誌 SVG -->
                    <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                    </svg>
                    <span>Google 登入</span>
                </button>
            </div>

            <!-- 頁尾條款宣告與裝飾 -->
            <div class="mt-8 text-center text-xs text-gray-400 leading-relaxed">
                登入即代表您同意 
                <a href="#" onclick="showMessage('服務條款', '這是 Yong GO 養狗 的服務條款內容。')" class="text-[#2F533C] font-bold underline">服務條款</a> 
                與 
                <a href="#" onclick="showMessage('隱私權政策', '這是 Yong GO 養狗 的隱私權政策內容。')" class="text-[#2F533C] font-bold underline">隱私權政策</a>
            </div>

        </div>
    </div>

    <!-- 自訂訊息對話框 (替代 alert) -->
    <div id="message-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="modal-content" class="bg-white rounded-3xl p-6 w-5/6 max-w-sm text-center shadow-2xl transform scale-90 transition-transform duration-300">
            <div class="w-12 h-12 bg-[#E4EDD1] text-[#2F533C] rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                <i class="fa-solid fa-paw"></i>
            </div>
            <h3 id="modal-title" class="text-lg font-bold text-[#2F533C] mb-2">提示</h3>
            <p id="modal-body" class="text-sm text-gray-600 mb-6">對話框內容...</p>
            <button onclick="closeModal()" class="w-full py-3 bg-[#2F533C] text-white font-bold rounded-xl shadow-md hover:bg-[#254230] transition-colors">
                確定
            </button>
        </div>
    </div>

    <!-- JavaScript 互動邏輯 -->
    <script>
        // 當前頁籤模式: 'login' | 'register'
        let currentMode = 'login';

        // 切換頁籤 (帳號登入 / 新用戶註冊)
        function switchTab(mode) {
            currentMode = mode;
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const submitBtn = document.getElementById('submit-btn');
            const forgotPwd = document.getElementById('forgot-pwd-link');

            if (mode === 'login') {
                tabLogin.className = 'flex-1 py-2.5 text-base tab-active transition-all duration-200 focus:outline-none';
                tabRegister.className = 'flex-1 py-2.5 text-base text-gray-400 hover:text-gray-600 transition-all duration-200 focus:outline-none';
                submitBtn.querySelector('span').textContent = '登入';
                forgotPwd.style.display = 'flex';
            } else {
                tabRegister.className = 'flex-1 py-2.5 text-base tab-active transition-all duration-200 focus:outline-none';
                tabLogin.className = 'flex-1 py-2.5 text-base text-gray-400 hover:text-gray-600 transition-all duration-200 focus:outline-none';
                submitBtn.querySelector('span').textContent = '註冊並登入';
                forgotPwd.style.display = 'none';
            }
        }

        // 密碼顯示/隱藏 切換
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.className = 'fa-regular fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                icon.className = 'fa-regular fa-eye';
            }
        }

        // 表單提交處理
        function handleFormSubmit(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const actionText = currentMode === 'login' ? '登入' : '註冊';

            if (!username) {
                showMessage('提醒', '請輸入帳號！');
                return;
            }

            showMessage('成功', `歡迎 ${username}！已成功完成${actionText}。`);
        }

        // Google 第三方登入處理
        function handleGoogleLogin() {
            showMessage('Google 登入', '正在跳轉至 Google 驗證頁面...');
        }

        // 顯示彈窗對話框 (取代系統 alert)
        function showMessage(title, message) {
            const modal = document.getElementById('message-modal');
            const modalContent = document.getElementById('modal-content');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').textContent = message;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-90');
            modalContent.classList.add('scale-100');
        }

        // 關閉彈窗對話框
        function closeModal() {
            const modal = document.getElementById('message-modal');
            const modalContent = document.getElementById('modal-content');

            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-90');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }
    </script>
</body>
</html>
